  <style>
    @font-face {
      font-family: "Luckiest Guy";
      src: url("/assets/fonts/luckiest-guy.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --bg: #0b0a0c;
      --text: #f3eee6;
      --muted: #a9a29a;
      --gold-1: #fff1a8;
      --gold-2: #f7c531;
      --gold-3: #b9780a;
      --gold-line: rgba(247, 197, 49, .55);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font: 400 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Selector de idioma ---------- */
    .lang {
      position: absolute; top: 16px; right: 16px; z-index: 5;
      display: flex; gap: 2px;
      background: rgba(11, 10, 12, .6);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px; padding: 3px;
      backdrop-filter: blur(6px);
    }
    .lang button {
      all: unset; cursor: pointer;
      font: 600 13px/1 system-ui, sans-serif; letter-spacing: .06em;
      padding: 7px 11px; border-radius: 999px; color: var(--muted);
    }
    .lang button[aria-pressed="true"] { background: var(--gold-2); color: #1a1205; }
    .lang button:focus-visible { outline: 2px solid var(--gold-1); outline-offset: 2px; }

    /* ---------- Arte de portada ---------- */
    .art {
      position: relative;
      height: clamp(340px, 62vh, 700px);
      overflow: hidden;
    }
    .art img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 50% 30%;
      display: block;
    }
    /* Funde el borde inferior con el fondo para que el logo «flote» encima */
    .art::after {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(to bottom, rgba(11,10,12,0) 55%, rgba(11,10,12,.85) 85%, var(--bg) 100%),
        linear-gradient(to right, var(--bg) 0, rgba(11,10,12,0) 12%, rgba(11,10,12,0) 88%, var(--bg) 100%);
      pointer-events: none;
    }

    /* ---------- Contenido ---------- */
    main {
      position: relative; z-index: 2;
      flex: 1;
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
      padding: 0 16px 48px;
      margin-top: clamp(-150px, -14vw, -70px); /* el logo se monta sobre el arte */
    }
    h1 { margin: 0; line-height: 0; }
    .logo {
      width: min(560px, 88vw); height: auto;
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, .75));
    }

    .eyebrow {
      margin: 18px 0 0;
      font-size: 13px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase;
      color: var(--muted);
    }
    .soon {
      margin: 6px 0 0;
      font-family: "Luckiest Guy", system-ui, sans-serif;
      font-size: clamp(44px, 8.5vw, 92px);
      line-height: 1.05;
      letter-spacing: .02em;
      text-transform: uppercase;
      background: linear-gradient(180deg, var(--gold-1) 8%, var(--gold-2) 52%, var(--gold-3) 96%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 0 #3a2400) drop-shadow(0 10px 24px rgba(0,0,0,.6));
      padding-top: .08em; /* evita que se corte la tilde de la Ó */
    }
    .tagline {
      max-width: 34em;
      margin: 14px auto 0;
      color: var(--text);
      font-size: clamp(16px, 2.1vw, 19px);
    }

    /* ---------- Botón de Steam ---------- */
    .steam {
      margin-top: 30px;
      display: inline-flex; align-items: center; gap: 12px;
      padding: 16px 28px;
      min-height: 56px;
      border-radius: 14px;
      text-decoration: none;
      color: #1a1205;
      font-weight: 750; font-size: 18px; letter-spacing: .01em;
      background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 55%, #e2a81a);
      box-shadow: 0 0 0 1px #6b4500 inset, 0 8px 0 #6b4500, 0 14px 30px rgba(247, 197, 49, .25);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .steam:hover { filter: brightness(1.06); transform: translateY(-2px);
      box-shadow: 0 0 0 1px #6b4500 inset, 0 10px 0 #6b4500, 0 18px 40px rgba(247, 197, 49, .35); }
    .steam:active { transform: translateY(5px);
      box-shadow: 0 0 0 1px #6b4500 inset, 0 3px 0 #6b4500, 0 8px 18px rgba(247, 197, 49, .2); }
    .steam:focus-visible { outline: 3px solid var(--gold-1); outline-offset: 6px; }
    .steam svg { width: 22px; height: 22px; flex: none; }

    .more {
      margin: 26px 0 0;
      font-size: 14px; color: var(--muted);
    }

    /* ---------- Pie ---------- */
    footer {
      padding: 22px 16px 28px;
      border-top: 1px solid rgba(255, 255, 255, .08);
      text-align: center;
      font-size: 13px; color: var(--muted);
    }
    footer a { color: var(--text); text-decoration-color: var(--gold-line); text-underline-offset: 3px; }
    footer a:hover { color: var(--gold-1); }

    @media (max-width: 600px) {
      .art { height: 56vh; height: 56svh; }
      .art img { object-position: 50% 25%; }
      .eyebrow { font-size: 11px; letter-spacing: .14em; }
      .steam { width: 100%; max-width: 420px; justify-content: center; font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .steam { transition: none; }
    }
  </style>
</head>
<body>

  <nav class="lang" aria-label="Idioma / Language">
    <button type="button" data-set-lang="es" aria-pressed="true">ES</button>
    <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
  </nav>

  <div class="art" aria-hidden="true">
    <picture>
      <source media="(max-width: 600px)" srcset="/assets/hero-mobile.jpg">
      <img src="/assets/hero.jpg" alt="" width="2880" height="930" fetchpriority="high">
    </picture>
  </div>

  <main>
    <h1>
      <img class="logo" src="/assets/logo.webp" width="1100" height="612"
           alt="PANGEA: Chronicles of the Lost Continent">
    </h1>

    <p class="eyebrow" data-i18n="eyebrow">Una aventura gráfica point &amp; click</p>
    <p class="soon" data-i18n="soon">Próximamente</p>
    <p class="tagline" data-i18n="tagline">Un encargo fácil. Un continente perdido. Humor ácido, inventario y puzles de los de antes.</p>

    <a class="steam"
       href="https://store.steampowered.com/app/4394080/?utm_source=web&amp;utm_medium=referral&amp;utm_campaign=proximamente"
       target="_blank" rel="noopener">
      <!-- icono de corazón (lista de deseados) -->
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 4.4 2.4h1.6c.8-1.3 2.3-2.4 4.4-2.4 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/>
      </svg>
      <span data-i18n="cta">Añádelo a tu lista de deseados en Steam</span>
    </a>

    <p class="more" data-i18n="more">Muy pronto, más novedades por aquí.</p>
  </main>

  <footer>
    © 2026 Lleans Games Studio ·
    <span data-i18n="contact">Contacto</span>:
    <a href="mailto:frank.frantic@pangeachronicles.com">frank.frantic@pangeachronicles.com</a>
  </footer>

  <script>
    // Textos en los dos idiomas. Para añadir uno nuevo, copia el bloque "en" y tradúcelo.
    const T = {
      es: {
        title: "PANGEA: Chronicles of the Lost Continent — Próximamente en Steam",
        eyebrow: "Una aventura gráfica point & click",
        soon: "Próximamente",
        tagline: "Un encargo fácil. Un continente perdido. Humor ácido, inventario y puzles de los de antes.",
        cta: "Añádelo a tu lista de deseados en Steam",
        more: "Muy pronto, más novedades por aquí.",
        contact: "Contacto"
      },
      en: {
        title: "PANGEA: Chronicles of the Lost Continent — Coming soon to Steam",
        eyebrow: "A point & click adventure",
        soon: "Coming soon",
        tagline: "An easy job. A lost continent. Sharp humor, inventory and puzzles the old-school way.",
        cta: "Wishlist it on Steam",
        more: "More news coming here soon.",
        contact: "Contact"
      }
    };

    function setLang(lang) {
      const t = T[lang] || T.es;
      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t[el.dataset.i18n];
      });
      document.querySelectorAll("[data-set-lang]").forEach(b => {
        b.setAttribute("aria-pressed", String(b.dataset.setLang === lang));
      });
      try { localStorage.setItem("pangea-lang", lang); } catch (e) {}
    }

    document.querySelectorAll("[data-set-lang]").forEach(b => {
      b.addEventListener("click", () => setLang(b.dataset.setLang));
    });

    // Idioma inicial: el que eligió el visitante antes; si no, el de su navegador.
    let saved = null;
    try { saved = localStorage.getItem("pangea-lang"); } catch (e) {}
    const nav = (navigator.language || "es").slice(0, 2).toLowerCase();
    const spanishLike = ["es", "ca", "gl", "eu"];   // castellano, catalán, gallego, euskera → ES
    setLang(saved || (spanishLike.includes(nav) ? "es" : "en"));
  </script>
